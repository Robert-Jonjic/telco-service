spring.application.name=telco

# --- H2 (file-based) ---
spring.datasource.url=jdbc:h2:file:./data/telco-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Dev-friendly logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- User Auth creds (override via env vars) ---
spring.security.user.name=${TELCO_BASIC_USER:telco}
spring.security.user.password=${TELCO_BASIC_PASS:change-me}
spring.security.user.roles=${TELCO_BASIC_ROLES:USER}

telco.seeding.enabled=true
