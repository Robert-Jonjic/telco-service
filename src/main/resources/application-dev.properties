# =========================================================
# PostgreSQL (dev)
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/telco
spring.datasource.username=${TELCO_DB_USER:telco}
spring.datasource.password=${TELCO_DB_PASS:telco123}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# Flyway (schema migrations)
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================================================
# JPA / Hibernate
# =========================================================
# Flyway owns the schema; Hibernate only validates mappings
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Logging (dev-friendly)
# =========================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
